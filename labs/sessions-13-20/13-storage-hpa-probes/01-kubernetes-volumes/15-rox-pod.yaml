apiVersion: v1
kind: Pod
metadata:
  name: rox-demo
  namespace: hw13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "sleep 3600"
      volumeMounts:
        - name: readonly-claim
          mountPath: /data
  volumes:
    - name: readonly-claim
      persistentVolumeClaim:
        claimName: am-rox
