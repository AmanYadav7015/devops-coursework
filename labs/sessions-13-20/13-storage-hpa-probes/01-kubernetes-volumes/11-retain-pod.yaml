apiVersion: v1
kind: Pod
metadata:
  name: retain-demo
  namespace: hw13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "sleep 3600"
      volumeMounts:
        - name: retain-storage
          mountPath: /data
  volumes:
    - name: retain-storage
      persistentVolumeClaim:
        claimName: retain-pvc
