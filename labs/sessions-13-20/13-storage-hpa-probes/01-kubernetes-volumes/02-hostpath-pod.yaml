apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: hw13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "sleep 3600"
      volumeMounts:
        - name: node-disk
          mountPath: /data
  volumes:
    - name: node-disk
      hostPath:
        path: /tmp/hw13-hostpath-data
        type: DirectoryOrCreate
