apiVersion: v1
kind: Pod
metadata:
  name: rwop-first
  namespace: hw13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "sleep 3600"
      volumeMounts:
        - name: exclusive
          mountPath: /data
  volumes:
    - name: exclusive
      persistentVolumeClaim:
        claimName: am-rwop
