apiVersion: v1
kind: Pod
metadata:
  name: static-storage-demo
  namespace: hw13
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - "sleep 3600"
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: static-pvc
