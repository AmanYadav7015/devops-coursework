apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: hw13
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: loader
          image: busybox:1.36
          command:
            - sh
            - -c
            - "for i in 1 2 3; do (while true; do wget -q -O /dev/null http://web-service.hw13.svc.cluster.local/; done) & done; wait"
          resources:
            requests:
              cpu: 50m
