apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reports-pvc-broken
  namespace: hw14
  labels:
    scenario: pending-unbound-pvc
    state: broken
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-nvme
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-pvc-broken
  namespace: hw14
  labels:
    app: reports
    scenario: pending-unbound-pvc
    state: broken
spec:
  containers:
    - name: reports
      image: nginx:1.27-alpine
      volumeMounts:
        - name: reports-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: reports-data
      persistentVolumeClaim:
        claimName: reports-pvc-broken
