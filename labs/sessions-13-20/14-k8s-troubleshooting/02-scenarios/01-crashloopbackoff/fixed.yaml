apiVersion: v1
kind: Pod
metadata:
  name: crashloop-fixed
  namespace: hw14
  labels:
    app: payment-worker
    scenario: crashloopbackoff
    state: fixed
spec:
  containers:
    - name: worker
      image: busybox:1.36
      env:
        - name: DATABASE_URL
          value: postgres://payments-db.hw14.svc.cluster.local:5432/payments
      command:
        - sh
        - -c
        - |
          echo "payment-worker: starting"
          if [ -z "$DATABASE_URL" ]; then
            echo "[FATAL] DATABASE_URL environment variable is MISSING" >&2
            exit 1
          fi
          echo "payment-worker: connected to $DATABASE_URL"
          sleep 3600
