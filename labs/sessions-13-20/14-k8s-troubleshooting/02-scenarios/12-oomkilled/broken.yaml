apiVersion: v1
kind: Pod
metadata:
  name: oomkilled-broken
  namespace: hw14
  labels:
    app: cache-service
    scenario: oomkilled
    state: broken
spec:
  containers:
    - name: cache
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "cache-service: warming in-memory cache"
          tail /dev/zero
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 32Mi
