apiVersion: v1
kind: Pod
metadata:
  name: oomkilled-fixed
  namespace: hw14
  labels:
    app: cache-service
    scenario: oomkilled
    state: fixed
spec:
  containers:
    - name: cache
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "cache-service: warming in-memory cache"
          dd if=/dev/zero of=/cache/warm bs=1M count=32
          echo "cache-service: warm, serving"
          sleep 3600
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 256Mi
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
