apiVersion: v1
kind: Pod
metadata:
  name: containercreating-broken
  namespace: hw14
  labels:
    app: tls-gateway
    scenario: containercreating
    state: broken
spec:
  containers:
    - name: gateway
      image: nginx:1.27-alpine
      volumeMounts:
        - name: tls
          mountPath: /etc/nginx/tls
          readOnly: true
  volumes:
    - name: tls
      secret:
        secretName: gateway-tls
