apiVersion: v1
kind: Secret
metadata:
  name: gateway-tls
  namespace: hw14
  labels:
    scenario: containercreating
    state: fixed
type: Opaque
stringData:
  tls.crt: placeholder-certificate
  tls.key: placeholder-private-key
---
apiVersion: v1
kind: Pod
metadata:
  name: containercreating-fixed
  namespace: hw14
  labels:
    app: tls-gateway
    scenario: containercreating
    state: fixed
spec:
  containers:
    - name: gateway
      image: nginx:1.27-alpine
      volumeMounts:
        - name: tls
          mountPath: /etc/nginx/tls
          readOnly: true
  volumes:
    - name: tls
      secret:
        secretName: gateway-tls
