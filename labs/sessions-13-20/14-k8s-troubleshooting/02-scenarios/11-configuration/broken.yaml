apiVersion: v1
kind: Pod
metadata:
  name: config-broken
  namespace: hw14
  labels:
    app: billing
    scenario: configuration
    state: broken
spec:
  containers:
    - name: billing
      image: busybox:1.36
      env:
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: billing-config
              key: LOGLEVEL
        - name: CURRENCY
          valueFrom:
            configMapKeyRef:
              name: billing-config
              key: CURRENCY
      command:
        - sh
        - -c
        - |
          echo "billing: LOG_LEVEL=$LOG_LEVEL CURRENCY=$CURRENCY"
          sleep 3600
