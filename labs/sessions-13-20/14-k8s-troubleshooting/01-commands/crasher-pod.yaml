apiVersion: v1
kind: Pod
metadata:
  name: demo-crasher
  namespace: hw14
  labels:
    app: demo-crasher
spec:
  containers:
    - name: crasher
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "boot: starting payment-worker v1.4.2"
          echo "boot: reading config from /etc/app"
          sleep 15
          echo "FATAL: cannot open /etc/app/app.conf: No such file or directory" >&2
          exit 3
