apiVersion: v1
kind: Pod
metadata:
  name: hw20-cpu-load
  namespace: hw20
  labels:
    app: hw20-cpu-load
spec:
  containers:
    - name: burner
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - while true; do :; done
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 300m
          memory: 64Mi
