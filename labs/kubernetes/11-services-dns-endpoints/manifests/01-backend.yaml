apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-nginx-conf
  namespace: hw11
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type text/plain;
        return 200 "hello from backend pod $hostname\n";
      }
      location /healthz {
        default_type text/plain;
        return 200 "ok\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hw11
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: conf
          configMap:
            name: backend-nginx-conf
