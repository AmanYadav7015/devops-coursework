apiVersion: v1
kind: Pod
metadata:
  name: netshoot
  namespace: hw11
  labels:
    app: netshoot
    role: client
spec:
  containers:
    - name: netshoot
      image: nicolaka/netshoot:latest
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "25m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
