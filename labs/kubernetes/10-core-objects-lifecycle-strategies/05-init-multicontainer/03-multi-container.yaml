apiVersion: v1
kind: Pod
metadata:
  name: multi-container
  namespace: hw10
  labels:
    app: multi-container
spec:
  volumes:
    - name: shared
      emptyDir: {}
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
      resources:
        requests:
          cpu: "20m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'while true; do echo "written by the writer container at $(date -u +%H:%M:%S)" > /data/index.html; sleep 10; done'
      volumeMounts:
        - name: shared
          mountPath: /data
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
