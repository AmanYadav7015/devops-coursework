apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner-demo
  namespace: hw10
  labels:
    app: owner-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: owner-demo
  template:
    metadata:
      labels:
        app: owner-demo
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
