apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  namespace: hw10
  labels:
    app: curl-client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 36000
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
