apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: hw10
  labels:
    app: myapp
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      slot: blue
  template:
    metadata:
      labels:
        app: myapp
        slot: blue
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - 'echo "BLUE SLOT - APP VERSION v1" > /usr/share/nginx/html/index.html'
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
