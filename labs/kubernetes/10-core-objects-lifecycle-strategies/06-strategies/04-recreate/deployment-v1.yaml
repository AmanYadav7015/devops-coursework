apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
  namespace: hw10
  labels:
    app: app-recreate
  annotations:
    kubernetes.io/change-cause: "v1 initial release"
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-recreate
  template:
    metadata:
      labels:
        app: app-recreate
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - 'echo "RECREATE - APP VERSION v1" > /usr/share/nginx/html/index.html'
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
