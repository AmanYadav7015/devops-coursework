apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-readiness
  namespace: hw10
  labels:
    app: probe-readiness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe-readiness
  template:
    metadata:
      labels:
        app: probe-readiness
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - 'echo ok > /usr/share/nginx/html/ready.html'
          readinessProbe:
            httpGet:
              path: /ready.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 1
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: probe-readiness
  namespace: hw10
  labels:
    app: probe-readiness
spec:
  type: ClusterIP
  selector:
    app: probe-readiness
  ports:
    - name: http
      port: 80
      targetPort: 80
