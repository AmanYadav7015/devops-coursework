apiVersion: v1
kind: Pod
metadata:
  name: probe-startup
  namespace: hw10
  labels:
    app: probe-startup
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'echo "slow boot started"; sleep 40; touch /tmp/started; echo "slow boot finished"; sleep 600'
      startupProbe:
        exec:
          command:
            - sh
            - -c
            - test -f /tmp/started
        periodSeconds: 5
        failureThreshold: 20
      livenessProbe:
        exec:
          command:
            - sh
            - -c
            - test -f /tmp/started
        periodSeconds: 5
        failureThreshold: 2
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
