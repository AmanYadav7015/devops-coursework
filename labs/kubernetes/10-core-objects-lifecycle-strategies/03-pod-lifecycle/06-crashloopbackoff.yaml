apiVersion: v1
kind: Pod
metadata:
  name: state-crashloop
  namespace: hw10
  labels:
    demo: lifecycle
spec:
  restartPolicy: Always
  containers:
    - name: crasher
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'echo "app booting"; sleep 3; echo "app crashed - cannot reach database"; exit 1'
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
