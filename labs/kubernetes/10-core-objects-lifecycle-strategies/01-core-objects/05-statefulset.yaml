apiVersion: v1
kind: Service
metadata:
  name: core-db
  namespace: hw10
  labels:
    app: core-db
spec:
  clusterIP: None
  selector:
    app: core-db
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core-db
  namespace: hw10
  labels:
    app: core-db
spec:
  serviceName: core-db
  replicas: 2
  selector:
    matchLabels:
      app: core-db
  template:
    metadata:
      labels:
        app: core-db
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: db
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
