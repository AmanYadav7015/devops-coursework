name: Session 16 CI/CD Pipeline

on:
  push:
    branches:
      - session-16-ci
    paths:
      - 'labs/16-github-actions/**'
      - '.github/workflows/session16-cicd.yml'
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Target environment for the CD stage'
        type: choice
        options:
          - staging
          - production
        default: staging
      skip_deploy:
        description: 'Stop after CI and skip the CD stage'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: session16-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: labs/16-github-actions
  IMAGE_NAME: yatri-fare-api

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: CI / Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/16-github-actions
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('labs/16-github-actions/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Report cache outcome
        run: echo "cache-hit=${{ steps.pip-cache.outputs.cache-hit }}"

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8
        run: |
          flake8 --version
          flake8 .

  test:
    name: CI / Test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
    defaults:
      run:
        working-directory: labs/16-github-actions
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('labs/16-github-actions/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Announce a warm cache
        if: steps.pip-cache.outputs.cache-hit == 'true'
        run: echo "pip cache restored, dependency install should be fast"

      - name: Show runner facts
        run: |
          echo "runner os     : ${{ runner.os }} (${{ runner.arch }})"
          echo "runner image  : ${{ matrix.os }}"
          echo "python        : $(python --version)"
          echo "cpu cores     : $(nproc)"
          echo "workspace     : ${GITHUB_WORKSPACE}"

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the unit test suite
        run: |
          mkdir -p reports
          pytest \
            --junitxml=reports/junit-py${{ matrix.python-version }}.xml \
            --cov=app \
            --cov-report=term \
            --cov-report=xml:reports/coverage-py${{ matrix.python-version }}.xml

      - name: Summarise coverage on the primary interpreter
        if: matrix.python-version == '3.12'
        run: |
          echo "### Coverage on Python 3.12" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("reports/coverage-py3.12.xml").getroot()
          pct = float(root.get("line-rate", 0)) * 100
          print(f"line coverage: **{pct:.1f}%**")
          PY

      - name: Upload the test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: labs/16-github-actions/reports/
          retention-days: 7
          if-no-files-found: error

  package:
    name: CI / Package
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.version.outputs.app_version }}
      image-tag: ${{ steps.version.outputs.image_tag }}
    defaults:
      run:
        working-directory: labs/16-github-actions
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derive the build version
        id: version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
          IMAGE_TAG="1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "resolved version ${VERSION}"
          echo "resolved image tag ${IMAGE_TAG}"

      - name: Download every test report produced by the matrix
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-py*
          path: labs/16-github-actions/incoming-reports
          merge-multiple: true

      - name: Verify the downloaded reports
        run: |
          echo "files received from the test matrix:"
          ls -la incoming-reports
          for f in incoming-reports/junit-py*.xml; do
            python - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suite = root if root.tag == "testsuite" else root[0]
          print("{}: tests={} failures={} errors={} time={}s".format(
              sys.argv[1], suite.get("tests"), suite.get("failures"),
              suite.get("errors"), suite.get("time")))
          PY
          done

      - name: Build the deployable package
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          GIT_COMMIT: ${{ github.sha }}
          BUILDER_NAME: github-actions-${{ github.run_id }}
        run: |
          chmod +x build.sh
          ./build.sh dist

      - name: Show the build metadata
        run: cat dist/build-info.txt

      - name: Upload the application package
        uses: actions/upload-artifact@v4
        with:
          name: yatri-fare-api-package
          path: labs/16-github-actions/dist/
          retention-days: 7
          if-no-files-found: error

  docker-build:
    name: CD / Build image
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download the application package
        uses: actions/download-artifact@v4
        with:
          name: yatri-fare-api-package
          path: package

      - name: Inspect the downloaded package
        run: |
          ls -la package
          cat package/build-info.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: package
          file: package/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.package.outputs.image-tag }}
          build-args: |
            APP_VERSION=${{ needs.package.outputs.app-version }}
            GIT_COMMIT=${{ github.sha }}

      - name: Show the resulting image
        run: |
          docker image ls "${IMAGE_NAME}"
          docker image inspect "${IMAGE_NAME}:${{ needs.package.outputs.image-tag }}" \
            --format 'id={{.Id}} size={{.Size}} user={{.Config.User}}'

      - name: Export the image as an artifact
        run: |
          docker save "${IMAGE_NAME}:${{ needs.package.outputs.image-tag }}" \
            | gzip -1 > image.tar.gz
          ls -lh image.tar.gz

      - name: Upload the image artifact
        uses: actions/upload-artifact@v4
        with:
          name: yatri-fare-api-image
          path: image.tar.gz
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: CD / Deploy to staging
    needs:
      - package
      - docker-build
    if: github.ref == 'refs/heads/session-16-ci' && inputs.skip_deploy != true
    runs-on: ubuntu-latest
    steps:
      - name: Report how this run was triggered
        run: |
          echo "event        : ${{ github.event_name }}"
          echo "ref          : ${{ github.ref }}"
          echo "version      : ${{ needs.package.outputs.app-version }}"
          echo "image tag    : ${{ needs.package.outputs.image-tag }}"

      - name: Report the manual dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: echo "manual dispatch requested environment ${{ inputs.deploy_environment }}"

      - name: Verify the deployment credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.SESSION16_REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.SESSION16_REGISTRY_TOKEN }}
          DEPLOY_WEBHOOK: ${{ secrets.SESSION16_DEPLOY_WEBHOOK }}
        run: |
          for name in REGISTRY_USERNAME REGISTRY_TOKEN DEPLOY_WEBHOOK; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::secret $name is not configured on this repository"
              exit 1
            fi
            fingerprint=$(printf '%s' "$value" | sha256sum | cut -c1-12)
            echo "$name present, length ${#value}, sha256 prefix ${fingerprint}"
          done

      - name: Download the image artifact
        uses: actions/download-artifact@v4
        with:
          name: yatri-fare-api-image
          path: image

      - name: Load the image into the runner daemon
        run: |
          ls -lh image
          docker load --input image/image.tar.gz
          docker image ls "${IMAGE_NAME}"

      - name: Start the release candidate
        run: |
          docker run -d \
            --name session16-yatri-staging \
            -p 8080:8080 \
            -e APP_VERSION='${{ needs.package.outputs.app-version }}' \
            -e GIT_COMMIT='${{ github.sha }}' \
            "${IMAGE_NAME}:${{ needs.package.outputs.image-tag }}"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "service answered after ${i} attempt(s)"
              break
            fi
            sleep 2
          done

      - name: Smoke test the deployed service
        run: |
          echo "GET /health"
          curl -fsS http://127.0.0.1:8080/health
          echo
          echo "GET /version"
          curl -fsS http://127.0.0.1:8080/version
          echo
          echo "POST /fare"
          curl -fsS -X POST http://127.0.0.1:8080/fare \
            -H 'Content-Type: application/json' \
            -d '{"distance_km": 12.5, "duration_min": 28, "surge": 1.4, "night": true, "coupon": "WEEKEND20", "riders": 2}'
          echo

      - name: Announce the release
        env:
          DEPLOY_WEBHOOK: ${{ secrets.SESSION16_DEPLOY_WEBHOOK }}
          REGISTRY_USERNAME: ${{ secrets.SESSION16_REGISTRY_USERNAME }}
        run: |
          host=$(printf '%s' "$DEPLOY_WEBHOOK" | sed -E 's#^[a-z]+://([^/]+).*#\1#')
          echo "would POST the release notification to host $host"
          echo "release ${{ needs.package.outputs.app-version }} published by the CI service account"
          {
            echo "### Deployment"
            echo ""
            echo "- environment: staging"
            echo "- image: ${IMAGE_NAME}:${{ needs.package.outputs.image-tag }}"
            echo "- commit: ${{ github.sha }}"
            echo "- smoke tests: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Container logs
        if: always()
        run: docker logs session16-yatri-staging

      - name: Tear down the release candidate
        if: always()
        run: |
          docker rm -f session16-yatri-staging
          docker image rm "${IMAGE_NAME}:${{ needs.package.outputs.image-tag }}"

  pipeline-summary:
    name: Pipeline summary
    needs:
      - lint
      - test
      - package
      - docker-build
      - deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print every job result
        run: |
          echo "lint         : ${{ needs.lint.result }}"
          echo "test         : ${{ needs.test.result }}"
          echo "package      : ${{ needs.package.result }}"
          echo "docker-build : ${{ needs.docker-build.result }}"
          echo "deploy       : ${{ needs.deploy.result }}"

      - name: Fail the pipeline when any stage failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::at least one stage did not succeed"
          exit 1

      - name: Report an all-green pipeline
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "every stage succeeded, the artifact is ready for promotion"
